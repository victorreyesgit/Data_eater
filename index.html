<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Data Eater</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Data Eater</h1>
    <span id="status" class="pill">Ready</span>
  </header>

  <section class="ring-wrap">
    <svg viewBox="0 0 200 200" class="ring">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#34d399"/>
          <stop offset="1" stop-color="#22d3ee"/>
        </linearGradient>
      </defs>
      <circle cx="100" cy="100" r="88" class="track"/>
      <circle cx="100" cy="100" r="88" class="progress" id="ring"/>
    </svg>
    <div class="center">
      <div id="total">0.00</div>
      <div class="unit">GB downloaded</div>
    </div>
  </section>

  <section class="stats">
    <div><b id="speed">0.0</b><span>Mbit/s</span></div>
    <div><b id="time">0:00</b><span>elapsed</span></div>
    <div><b id="left">-</b><span>remaining</span></div>
  </section>

  <section class="card">
    <label>Target
      <span class="field"><input id="target" type="number" value="1" min="0.1" max="50" step="0.5" inputmode="decimal"><em>GB</em></span>
    </label>
    <label>Parallel streams
      <select id="streams"><option>1</option><option selected>2</option><option>4</option></select>
    </label>
  </section>

  <button id="go">Start</button>
  <p class="note">Runs only while this screen is open. Turn Wi-Fi off to use mobile data.</p>
</main>
<script src="script.js"></script>
</body>
</html>
